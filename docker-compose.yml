services:
  dev-proxy:
    build: .
    container_name: dev-proxy
    cap_add: [NET_ADMIN]
    environment:
      SOCKS_SERVER: ${SOCKS_SERVER}
      SOCKS_PORT: ${SOCKS_PORT}
      SOCKS_USERNAME: ${SOCKS_USERNAME:-}
      SOCKS_PASSWORD: ${SOCKS_PASSWORD:-}
    ports:
      - "7890:7890"
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
