mode: "rule"
log-level: "info"
ipv6: false
allow-lan: false
proxies:
  - name: "proxy"
    type: "socks5"
    server: "4.kleeclub.top"
    port: 13579
    # Fill these locally if your SOCKS5 server requires authentication.
    username: "<SOCKS_USERNAME>"
    password: "<SOCKS_PASSWORD>"
    udp: true
proxy-groups:
  - name: "GLOBAL"
    type: "select"
    proxies:
      - "proxy"
tun:
  enable: true
  device: "mihomo0"
  stack: "mixed"
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 1500
dns:
  enable: true
  listen: "127.0.0.1:1053"
  ipv6: false
  enhanced-mode: "fake-ip"
  fake-ip-filter:
    - "4.kleeclub.top"
    - "*.lan"
    - "*.local"
  fake-ip-range: "198.18.0.1/16"
  respect-rules: true
  default-nameserver:
    - "8.8.8.8"
    - "1.1.1.1"
  proxy-server-nameserver:
    - "8.8.8.8"
    - "1.1.1.1"
  nameserver:
    - "https://1.1.1.1/dns-query#proxy"
    - "https://8.8.8.8/dns-query#proxy"
rules:
  - "DOMAIN,4.kleeclub.top,DIRECT"
  - "DOMAIN-SUFFIX,looklook.dev,DIRECT"
  - "IP-CIDR,154.219.107.44/32,DIRECT,no-resolve"
  - "IP-CIDR,47.108.195.230/32,DIRECT,no-resolve"
  - "DOMAIN-SUFFIX,lan,DIRECT"
  - "DOMAIN-SUFFIX,local,DIRECT"
  - "IP-CIDR,10.0.0.0/8,DIRECT"
  - "IP-CIDR,172.16.0.0/12,DIRECT"
  - "IP-CIDR,192.168.0.0/16,DIRECT"
  - "IP-CIDR,127.0.0.0/8,DIRECT"
  - "IP-CIDR,169.254.0.0/16,DIRECT"
  - "IP-CIDR,100.64.0.0/10,DIRECT"
  - "IP-CIDR6,::1/128,DIRECT"
  - "IP-CIDR6,fc00::/7,DIRECT"
  - "IP-CIDR6,fe80::/10,DIRECT"
  - "MATCH,GLOBAL"
